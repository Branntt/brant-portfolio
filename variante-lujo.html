<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6 Casas · Diseño, obra y privacidad</title>
<meta name="description" content="Seis casas de lujo. Diseño, obra y privacidad. Visitas privadas, solo con cita.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1a17;
    --ink-2: #221d1e;
    --cream: #f8f8f6;
    --cream-2: #f1f0ec;
    --green: #2c6754;
    --line-dark: #333a36;
    --muted-dark: #9b9892;
    --muted: #726e67;
    --line: #d2d9d2;

    --f-display: 'Bodoni Moda', 'Didot', 'Bodoni 72', serif;
    --f-italic: 'Cormorant Garamond', 'Garamond', serif;
    --f-label: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;

    --gutter: clamp(24px, 5vw, 96px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cream: #1c1a17;
      --ink: #f8f8f6;
    }
  }
  :root[data-theme="dark"] {
    --cream: #1c1a17;
    --ink: #f8f8f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink-2);
    color: var(--cream);
    font-family: var(--f-label);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .stage {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 28px var(--gutter) 32px;
  }

  /* Barra superior */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-family: var(--f-label);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted-dark);
    border-bottom: 1px solid var(--line-dark);
    padding-bottom: 18px;
  }
  .top .mark { color: var(--cream); font-weight: 600; }

  /* Bloque principal */
  .main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(56px, 12vh, 140px) 0;
  }

  .kicker {
    font-family: var(--f-label);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: clamp(20px, 3vw, 36px);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .kicker::before {
    content: "";
    width: 48px;
    height: 1px;
    background: var(--green);
  }

  /* Título: autoritario, mayúsculas, alto contraste */
  h1 {
    font-family: var(--f-display);
    font-optical-sizing: auto;
    font-weight: 900;
    font-size: clamp(2.5rem, 11vw, 9rem);
    line-height: 0.82;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--cream);
  }
  h1 .num {
    display: block;
    font-weight: 400;
    font-style: italic;
    font-family: var(--f-italic);
    text-transform: none;
    font-size: 0.42em;
    letter-spacing: 0;
    color: var(--cream);
    margin-bottom: 0.12em;
    line-height: 1;
  }
  h1 .num em { color: var(--green); font-style: italic; }

  /* Subtítulo: serif itálica, de lectura elegante */
  .lead {
    margin-top: clamp(28px, 4vw, 52px);
    font-family: var(--f-display);
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.7rem, 3.6vw, 2.9rem);
    line-height: 1.15;
    color: var(--cream);
    max-width: 22ch;
  }

  .rule {
    width: 100%;
    height: 1px;
    background: var(--line-dark);
    margin: clamp(36px, 5vw, 64px) 0 clamp(24px, 3vw, 36px);
  }

  .meta {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 28px 48px;
    align-items: end;
  }

  .pillars {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 36px;
    font-family: var(--f-label);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--cream);
  }
  .pillars li + li::before {
    content: "—";
    color: var(--green);
    margin-right: 36px;
    letter-spacing: 0;
  }

  .note {
    font-family: var(--f-italic);
    font-size: 1.15rem;
    color: var(--muted-dark);
    margin-top: 10px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 20px 32px;
    background: var(--green);
    color: var(--cream);
    font-family: var(--f-label);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--green);
    transition: background .4s ease, color .4s ease, border-color .4s ease;
    white-space: nowrap;
  }
  .cta:hover, .cta:focus-visible {
    background: transparent;
    color: var(--cream);
    border-color: var(--cream);
  }
  .cta span.arrow { font-family: var(--f-italic); font-size: 18px; letter-spacing: 0; }

  /* Pie */
  .foot {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px 24px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted-dark);
    border-top: 1px solid var(--line-dark);
    padding-top: 18px;
  }

  @media (max-width: 760px) {
    .top { font-size: 10px; letter-spacing: 0.22em; }
    .top span:last-child { display: none; }
    .meta { grid-template-columns: 1fr; }
    .cta { width: 100%; justify-content: space-between; }
    .pillars { gap: 10px 22px; }
    .pillars li + li::before { margin-right: 22px; }
    .foot { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="stage">

  <header class="top">
    <span class="mark">Bacu Creative</span>
    <span>Visitas privadas</span>
  </header>

  <main class="main">
    <p class="kicker">Colección privada</p>

    <h1>
      <span class="num">Seis <em>casas</em></span>
      Diseño,<br>obra y<br>privacidad
    </h1>

    <p class="lead">Visitas privadas, solo con cita.</p>

    <div class="rule" aria-hidden="true"></div>

    <div class="meta">
      <ul class="pillars">
        <li>Diseño</li>
        <li>Obra</li>
        <li>Privacidad</li>
      </ul>
      <a class="cta" href="contacto.html">Solicitar cita <span class="arrow">→</span></a>
    </div>
  </main>

  <footer class="foot">
    <span>Seis casas de lujo</span>
    <span>Solo con cita</span>
  </footer>

</div>

</body>
</html>
